
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MyWebsite</title>

  <style>
    :root {
      --primary: #6c63ff;
      --dark: #17162b;
      --light: #f7f7fb;
      --text: #555568;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--light);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .logo {
      color: var(--dark);
      font-size: 24px;
      font-weight: 700;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--primary);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 50px;
      max-width: 1100px;
      min-height: 520px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .welcome h1 {
      max-width: 550px;
      margin-bottom: 20px;
      color: var(--dark);
      font-size: clamp(42px, 7vw, 65px);
      line-height: 1.05;
    }

    .welcome p {
      max-width: 520px;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .visual {
      display: grid;
      place-items: center;
      min-height: 450px;
      padding: 30px;
      border-radius: 28px;
      background: linear-gradient(135deg, #7971ff, #b55cff);
      box-shadow: 0 24px 60px rgba(108, 99, 255, 0.24);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 36px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 16px 40px rgba(23, 22, 43, 0.18);
    }

    .login-card h2 {
      margin-bottom: 10px;
      color: var(--dark);
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 28px;
      color: var(--text);
      text-align: center;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
      font-weight: 600;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dddded;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12);
    }

    .forgot {
      display: block;
      margin-top: -8px;
      margin-bottom: 22px;
      color: var(--primary);
      text-align: right;
      text-decoration: none;
      font-size: 13px;
    }

    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      color: white;
      background: var(--primary);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .button:hover {
      opacity: 0.88;
      transform: translateY(-2px);
    }

    .signup {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
    }

    .signup a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 760px) {
      header {
        padding-top: 18px;
      }

      nav {
        gap: 12px;
      }

      main {
        grid-template-columns: 1fr;
        gap: 30px;
        padding-top: 30px;
        text-align: center;
      }

      .welcome h1,
      .welcome p {
        margin-left: auto;
        margin-right: auto;
      }

      .visual {
        min-height: 400px;
        padding: 20px;
      }

      .login-card {
        padding: 28px 22px;
      }
    }

    @media (max-width: 400px) {
      nav {
        gap: 8px;
      }

      nav a {
        font-size: 13px;
      }

      .logo {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="#">MyWebsite</a>

    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#login">Login</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">

    <section class="welcome">
      <h1>Welcome Back!</h1>

      <p>
        Login to your account and continue your journey.
        We're happy to have you back.
      </p>
    </section>

    <section class="visual" id="login">

      <div class="login-card">

        <h2>Login</h2>

        <p class="subtitle">
          Please enter your account details
        </p>

        <form id="loginForm">

          <div class="input-group">
            <label for="username">Username</label>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
              autocomplete="username"
            >
          </div>

          <div class="input-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
          </div>

          <a href="#" class="forgot">
            Forgot Password?
          </a>

          <button type="submit" class="button">
            Login
          </button>

          <p id="message" aria-live="polite"></p>

        </form>

        <p class="signup">
          Don't have an account?
          <a href="#">Sign Up</a>
        </p>

      </div>

    </section>

  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;

      message.style.color = "#6c63ff";
      message.textContent = "Login UI submitted for " + username;
    });
  </script>

</body>
</html>
