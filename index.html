<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Simple Website</title>
  <style>
    :root {
      --primary: #6c63ff;
      --dark: #17162b;
      --light: #f7f7fb;
      --text: #555568;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--light);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .logo {
      color: var(--dark);
      font-size: 24px;
      font-weight: 700;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--primary);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 50px;
      max-width: 1100px;
      min-height: 520px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      max-width: 550px;
      margin-bottom: 20px;
      color: var(--dark);
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.05;
    }

    p {
      max-width: 520px;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 14px 26px;
      border: none;
      border-radius: 8px;
      color: white;
      background: var(--primary);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.88;
    }

    .visual {
      display: grid;
      place-items: center;
      min-height: 380px;
      border-radius: 28px;
      background: linear-gradient(135deg, #7971ff, #b55cff);
      box-shadow: 0 24px 60px rgba(108, 99, 255, 0.24);
    }

    .card {
      width: 78%;
      padding: 36px;
      border-radius: 18px;
      color: var(--dark);
      background: white;
      box-shadow: 0 16px 40px rgba(23, 22, 43, 0.18);
    }

    .card strong {
      display: block;
      margin-bottom: 10px;
      font-size: 28px;
    }

    @media (max-width: 760px) {
      header {
        padding-top: 18px;
      }

      nav {
        gap: 12px;
      }

      main {
        grid-template-columns: 1fr;
        gap: 30px;
        padding-top: 30px;
        text-align: center;
      }

      p {
        margin-inline: auto;
      }

      .visual {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#">MyWebsite</a>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section>
      <h1>Build something great.</h1>
      <p>Create a modern and memorable online presence with a simple, responsive website that works beautifully on every screen.</p>
      <a class="button" href="#about">Get Started</a>
    </section>

    <section class="visual" id="about" aria-label="Website preview">
      <div class="card">
        <strong>Simple. Modern. Fast.</strong>
        Your ideas deserve a beautiful digital home.
      </div>
    </section>
  </main>
</body>
</html>
